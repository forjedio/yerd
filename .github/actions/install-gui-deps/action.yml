name: Install Linux GUI build deps
description: >
  Install the GTK/WebKit/etc. -dev packages the Tauri GUI crate links, so
  `cargo build/clippy/test --workspace` works on Linux. Always runs
  `apt-get update` first: the runner image's baked-in package lists go stale
  whenever Ubuntu supersedes a dependency (e.g. a GStreamer security update),
  and installing from them 404s. Deliberately uncached: cache-apt-pkgs-action
  skipped the update, swallowed the failed install, and saved an empty cache
  that every later run restored. Requires the repo to be checked out first.
runs:
  using: composite
  steps:
    - name: apt-get install
      shell: bash
      run: |
        sudo apt-get -o DPkg::Lock::Timeout=300 update
        sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 \
          install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
          libdbus-1-dev libxdo-dev librsvg2-dev

    - name: Verify GUI deps are visible to pkg-config
      shell: bash
      run: pkg-config --exists --print-errors gtk+-3.0 gdk-3.0 webkit2gtk-4.1 javascriptcoregtk-4.1 libsoup-3.0 ayatana-appindicator3-0.1 dbus-1 librsvg-2.0
