[package]
name                   = "yerd-tunnel"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
description            = "Tunnel provider (Cloudflare, ngrok, zrok) argument/config generation and supervised tunnel lifecycle for Yerd."

[dependencies]
yerd-supervise = { path = "../yerd-supervise" }
async-trait    = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
tokio          = { workspace = true, features = ["time", "macros", "net", "io-util"] }

[dev-dependencies]
tokio          = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tempfile       = { workspace = true }

[lints]
workspace = true
